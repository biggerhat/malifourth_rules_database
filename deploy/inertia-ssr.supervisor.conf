; Runs the Inertia SSR renderer in production.
;
; This repo has no production process manager checked in (only Sail's local
; docker-compose.yml), so `php artisan inertia:start-ssr` is never actually
; started on the deployed host, and config/inertia.php's ssr.enabled=true
; silently falls back to client-side rendering. Install this file on the
; production server (e.g. Forge: Server > "Daemons", or drop it directly
; into /etc/supervisor/conf.d/) to fix that.
;
; Build step (run once per deploy, before (re)starting this program):
;   npm run build:ssr
;
; Then: supervisorctl reread && supervisorctl update && supervisorctl start inertia-ssr:*

[program:inertia-ssr]
process_name=%(program_name)s
command=php /var/www/html/artisan inertia:start-ssr
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/inertia-ssr.log
stopwaitsecs=10
